name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the build only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The repo is public: only placeholder (example.com) or company (assetstackai.com) addresses in src/.
      - name: Check src/ for real email addresses
        run: |
          if grep -rEoHn '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' src | grep -vE '@(example\.com|assetstackai\.com)$'; then
            echo "Use @example.com placeholders in src/." >&2
            exit 1
          fi
      - run: npm ci
      # Sync mapping + migration/RLS checks (PGlite, no network).
      - run: npm test
      # No Supabase env vars here, so this is the demo-mode build.
      - run: npm run build
