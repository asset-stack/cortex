version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Must come first: an update goes to the first group it matches, and
      # npm-minor-and-patch (no patterns) matches every package.
      react:
        patterns: ["react", "react-dom"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major migrations not yet planned (vite + plugin-react must land together).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
